<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{--paper:#f4f1ea;--card:#fbf9f4;--ink:#16140f;--muted:#625d53;--line:#d7d0c4;--accent:#c2410c;--r:20px;margin:0;background:var(--paper);color:var(--ink);font:15px/1.75 system-ui,"Noto Sans SC",sans-serif}main{max-width:1200px;margin:auto;padding:40px 36px 80px}a{color:var(--accent);overflow-wrap:anywhere}h1{font-size:clamp(36px,6vw,80px);line-height:1.14;letter-spacing:-.03em;max-width:1000px}h2{font-size:28px;line-height:1.35}h3{font-size:20px}.hero{padding:32px 0 48px;border-top:3px solid var(--accent)}.eyebrow,.exhibit,.source{color:var(--muted);font-size:12px;letter-spacing:.04em}.thesis{font-size:clamp(20px,3vw,30px);max-width:880px;border-left:4px solid var(--accent);padding-left:20px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}.metric{padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}.metric strong{display:block;font-size:44px;line-height:1.5;font-variant-numeric:tabular-nums}.metric span{color:var(--muted)}nav{display:flex;flex-wrap:wrap;gap:10px 22px;padding:20px 0;border-block:1px solid var(--line)}nav a{text-decoration:none;font-size:13px}section{padding:44px 0;border-bottom:1px solid var(--line);scroll-margin-top:20px}.section-head{margin-bottom:24px}.section-head h2{margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{position:relative;padding:26px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);min-width:0}.index{font-size:36px;color:var(--accent);font-weight:700}.missing{padding:14px 18px;border:1px dashed var(--line);color:var(--muted);font-size:14px}dl{margin:10px 0}dt{font-size:12px;font-weight:700;color:var(--muted);margin-top:12px}dd{margin:3px 0 10px;overflow-wrap:anywhere;white-space:pre-wrap}ul{padding-left:22px}li{margin:8px 0}details{margin-top:20px;border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}summary{cursor:pointer;font-weight:600}details details,dd dl{padding-left:12px;border-left:2px solid var(--line)}.source{margin-top:20px}a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
body.editorial h1,body.editorial h2,body.editorial .metric strong{font-family:Georgia,"Noto Serif SC","Songti SC",serif}body.editorial #s0 .card:first-child{background:#16140f;color:#fbf9f4}body.editorial #s0 .card:first-child dt{color:#c4beb0}body.editorial #s0 .card:first-child .index{color:#ff8a4c}
body.bento-dark{--paper:#090b10;--card:#131824;--ink:#f3f4f6;--muted:#a1aaba;--line:#303849;--accent:#a5a6ff;background:radial-gradient(ellipse at top,#202442,transparent 800px),#090b10}body.bento-dark .hero{border:0}body.bento-dark .card,body.bento-dark .metric{box-shadow:0 12px 36px #0005;transition:transform .2s,border-color .2s}body.bento-dark .card:hover{transform:translateY(-3px);border-color:var(--accent)}body.bento-dark #s0 .grid{grid-template-columns:2fr 1fr}body.bento-dark .metric strong{font-family:monospace;color:#c7c9ff}
body.mckinsey{--paper:#f8fafc;--card:#fff;--ink:#0b1f3a;--muted:#475569;--line:#dbe2eb;--accent:#1f5fbf;--r:10px}body.mckinsey h1{font-size:clamp(32px,4.5vw,60px)}body.mckinsey .card{border-top:3px solid var(--accent);box-shadow:0 3px 10px #0b1f3a08}body.mckinsey .metric strong{font-family:monospace}body.mckinsey .section-head{display:grid;grid-template-columns:110px 1fr;align-items:center}body.mckinsey .exhibit{font-family:monospace;color:var(--accent)}
body.swiss{--paper:#f2f0ea;--card:#faf8f3;--ink:#111;--muted:#444;--line:#111;--accent:#c51c13;--r:0}body.swiss h1{font-weight:950;letter-spacing:-.05em}body.swiss .card,body.swiss .metric{border-width:2px}body.swiss .card:hover{box-shadow:6px 6px 0 #111}body.swiss .index{font-size:64px;font-weight:900}body.swiss .section-head{border-top:8px solid #111;padding-top:20px}body.swiss .metrics{gap:0}body.swiss .metric:first-child{background:#e3261c;color:white}body.swiss .metric:first-child span{color:white}
body.xhs-craft{--paper:#fffdf6;--card:#fff;--ink:#22201c;--muted:#625b50;--line:#dfd6be;--accent:#be123c;--r:18px;background:linear-gradient(#efead8 1px,transparent 1px),linear-gradient(90deg,#efead8 1px,transparent 1px),var(--paper);background-size:20px 20px}body.xhs-craft h2{display:inline;background:linear-gradient(transparent 55%,#fef08a 55%)}body.xhs-craft .card{box-shadow:3px 5px 0 #e7dfc780;margin-top:12px}body.xhs-craft .card:before{content:"";position:absolute;width:70px;height:22px;background:#fecdd3b3;top:-10px;left:30px;transform:rotate(-5deg)}body.xhs-craft .card:nth-child(even):before{background:#fef08ab3;transform:rotate(4deg)}body.xhs-craft .thesis{background:#fff9c8;padding:20px;border:0;transform:rotate(-.4deg)}
@media(max-width:900px){main{padding:20px}.grid,body.bento-dark #s0 .grid{grid-template-columns:1fr}.metrics{gap:8px}.metric{padding:14px}.metric strong{font-size:30px}.hero{padding-top:15px}body.mckinsey .section-head{display:block}}@media(max-width:480px){.metrics{grid-template-columns:1fr}.metric{display:flex;justify-content:space-between;align-items:center}h2{font-size:24px}.card{padding:20px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}body.bento-dark .card{transition:none}body.bento-dark .card:hover{transform:none}}@media print{body{--paper:white;--card:white;--ink:#111;--muted:#444;--line:#aaa;--accent:#222;background:white!important;color:#111}main{max-width:none;padding:0}nav{display:none}.card,.metric{break-inside:avoid;box-shadow:none!important;background:white!important;color:#111!important}.card dt{color:#444!important}h1{font-size:36px}details{overflow:visible}section{padding:20px 0}}
</style>
</head>
<body class="__STYLE__"><main>__BODY__</main>
<script type="application/json" id="analysis-data">__DATA__</script>
<script type="application/json" id="narrative-data">__NARRATIVE__</script>
</body>
</html>
